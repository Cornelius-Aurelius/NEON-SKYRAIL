<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

 "@context":"https://schema.org",
 "@type":"CreativeWork",
 "name":"Neon Skyrail",
 "creator":{"@type":"Person","name":"Cornelius Aurelius"},
 "description":"A neon hover racing game fully built in a single HTML file."

<style>
body {
    margin:0; background:black; overflow:hidden;
    font-family:Arial, sans-serif; touch-action:manipulation;
}
canvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
}

#ui {
    position:fixed; top:10px; left:50%;
    transform:translateX(-50%);
    font-size:1.3rem; color:#0ff;
    text-shadow:0 0 15px #0ff;
    z-index:20; text-align:center;
}

#big {
    position:fixed; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:2.6rem; color:#0ff;
    text-shadow:0 0 25px #0ff;
    display:none; z-index:30;
    text-align:center;
}

#big button {
    margin-top:20px; padding:12px 25px;
    font-size:1.1rem; background:#0ff; color:#000;
    border:none; border-radius:10px;
    cursor:pointer;
}

footer {
    position:fixed; bottom:10px; width:100%;
    text-align:center; color:#0ff;
    opacity:.6; font-size:.85rem;
    z-index:40;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
Speed: <span id="spd">0</span><br>
Distance: <span id="dist">0</span><br>
Best: <span id="best">0</span>
</div>

<div id="big">
    <div id="msg"></div>
    <button onclick="start()">PLAY AGAIN</button>
</div>

<footer>
Created by CORNELIUS AURELIUS —
<a href="https://zenodo.org/records/17362534" style="color:#0ff;" target="_blank">Zenodo Peace</a>
</footer>

<script>
/* ==========================================================
   NEON SKYRAIL™ — INFINITE HOVER RACER ENGINE
========================================================== */
const cv=document.getElementById("game"), ctx=cv.getContext("2d");
let W,H; function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;} resize(); onresize=resize;

let playerX=0, targetX=0;
let obstacles=[];
let speed=4;
let distance=0;
let best=localStorage.sky_best?+localStorage.sky_best:0;

document.getElementById("best").textContent=best;

let playing=false;

cv.addEventListener("pointerdown", e=>{
    targetX=(e.clientX - W/2)/4;
});
cv.addEventListener("pointermove", e=>{
    if(!playing) return;
    targetX=(e.clientX - W/2)/4;
});

/* Start Game */
function start(){
    speed=4;
    distance=0;
    obstacles=[];
    playerX=0;
    targetX=0;

    playing=true;
    document.getElementById("big").style.display="none";
}

/* Spawn obstacles */
function spawnObstacle(){
    if(!playing) return;
    obstacles.push({
        x:(Math.random()*200-100),
        y:H,
        w:50,
        h:40
    });
    setTimeout(spawnObstacle, Math.max(300, 900 - speed*20));
}

/* Game Over */
function gameOver(){
    playing=false;
    document.getElementById("msg").innerHTML=
        "CRASHED<br>Distance: "+Math.floor(distance);

    document.getElementById("big").style.display="block";

    if(distance>best){
        best=distance;
        localStorage.sky_best=best;
        document.getElementById("best").textContent=best;
    }
}

/* Render Loop */
function draw(){
    ctx.clearRect(0,0,W,H);

    // Track lines
    for(let i=0;i<20;i++){
        ctx.strokeStyle="rgba(0,255,255,0.2)";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.moveTo(W/2 + Math.sin(i*0.6 + distance*0.01)*40, H - i*60 + (distance%60));
        ctx.lineTo(W/2 + Math.sin(i*0.6 + distance*0.01)*40, H - i*60 + 40 + (distance%60));
        ctx.stroke();
    }

    // Player lerp
    playerX += (targetX - playerX)*0.15;

    // Draw player
    ctx.beginPath();
    ctx.fillStyle="#0ff";
    ctx.shadowBlur=20;
    ctx.shadowColor="#0ff";
    ctx.arc(W/2 + playerX, H*0.75, 22, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;

    // Obstacles
    obstacles.forEach((o,i)=>{
        o.y -= speed;

        ctx.fillStyle="#09f";
        ctx.fillRect(W/2 + o.x - o.w/2, o.y - o.h/2, o.w, o.h);

        // Collision
        if(Math.abs((W/2 + playerX) - (W/2+o.x)) < 32 &&
           Math.abs((H*0.75) - o.y) < 32){
            gameOver();
        }

        if(o.y < -50){
            obstacles.splice(i,1);
        }
    });

    if(playing){
        distance += speed/2;
        speed += 0.002; 

        document.getElementById("spd").textContent=speed.toFixed(1);
        document.getElementById("dist").textContent=Math.floor(distance);
    }

    requestAnimationFrame(draw);
}

draw();
start();
setTimeout(spawnObstacle,600);
</script>

</body>
</html>
